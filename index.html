<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitationsbogen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quill.snow.css">
    <script src="js/script.js"></script>
    <script src="js/quill.min.js"></script>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <h1>Hospitationsbogen</h1>
            <div class="session-bar">
                <select id="session-select">
                    <option value="">Session auswählen…</option>
                </select>
                <button id="new-session" class="btn-session">Neu</button>
                <button id="save-session" class="btn-session">Speichern</button>
                <button id="import-json" class="btn-session">Import</button>
                <button id="export-json" class="btn-session">Export</button>
                <button id="delete-session" class="btn-session" style="display:none;" title="Session löschen">Löschen</button>
                <button id="theme-toggle" class="btn-theme">Hell</button>
                <input type="file" id="json-file-input" accept=".json" class="hidden">
            </div>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button id="tab-stammdaten" class="tab-btn active">Stammdaten</button>
        <button id="tab-erfassung" class="tab-btn">Erfassung</button>
        <button id="tab-auswertung" class="tab-btn">Auswertung</button>
    </div>

    <!-- Tab: Stammdaten -->
    <div id="stammdaten" class="tab-content active">
        <div class="section">
            <h2 class="section-title">Stammdaten der Hospitation</h2>
            <div class="form-grid">
                <div class="form-group required">
                    <label>Lehrkraft</label>
                    <input type="text" id="name" placeholder="z.B. Max Mustermann">
                </div>
                <div class="form-group required">
                    <label>Datum</label>
                    <input type="date" id="datum">
                </div>
                <div class="form-group">
                    <label>Klasse</label>
                    <input type="text" id="klasse" placeholder="z.B. 7a">
                </div>
                <div class="form-group">
                    <label>Fach</label>
                    <input type="text" id="fach" placeholder="z.B. Mathematik">
                </div>
                <div class="form-group">
                    <label>Dauer (Min.)</label>
                    <input type="number" id="dauer" value="45" min="1" max="120">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Thema der Stunde</label>
                    <input type="text" id="thema" placeholder="z.B. Einführung in die Prozentrechnung">
                </div>
            </div>
        </div>
    </div>

    <!-- Tab: Erfassung -->
    <div id="erfassung" class="tab-content">

        <div class="section">
            <h2 class="section-title">Verlauf der Stunde</h2>
            <div id="phasen-fields"></div>
            <button type="button" id="add-phase" class="btn-add">+ Phase hinzufügen</button>
        </div>

        <div class="section">
            <h2 class="section-title">Allgemeine Beobachtungen</h2>
            <div id="general-notes-editor"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Fotos der Stunde</h2>
            <label for="photo-upload" class="photo-upload-label">Foto aufnehmen oder hochladen</label>
            <input type="file" id="photo-upload" accept="image/*" capture="environment" multiple class="hidden">
            <div id="photos-preview"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Bewertungskategorien</h2>
            <p class="hint">Klicken Sie auf eine Kategorie, um sie aufzuklappen und zu bewerten.</p>
            <div id="kategorien-container"></div>
        </div>
    </div>

    <!-- Tab: Auswertung -->
    <div id="auswertung" class="tab-content">
        <div class="section">
            <div class="auswertung-actions">
                <button onclick="window.print()" class="btn-action">Drucken</button>
                <button id="export-markdown" class="btn-action btn-green">Markdown</button>
            </div>

            <h3 class="section-title">Stammdaten</h3>
            <div id="stammdaten-overview" class="stammdaten-grid"></div>

            <div id="phasen-display" class="card" style="display:none;">
                <h4>Verlauf der Stunde</h4>
                <div id="phasen-list"></div>
            </div>

            <div id="sozialform-distribution" class="card" style="display:none;"></div>

            <div class="card" style="margin-top:0.75rem; padding:0;">
                <div style="padding:0.875rem 1rem 0;">
                    <h3 class="section-title" style="margin-bottom:0;">Durchschnittsbeobachtungen</h3>
                </div>
                <div id="stats-container" style="padding:0 1rem 1rem;"></div>
            </div>

            <h3 class="section-title" style="margin-top:1.5rem;">Detailansicht</h3>
            <div id="details-container"></div>

            <div id="auswertung-photos" class="photos-section">
                <h3 class="section-title">Fotos</h3>
                <div id="auswertung-photos-grid"></div>
            </div>
        </div>
    </div>

</div>

<!-- Image Modal -->
<div id="image-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <img id="modal-image" src="" alt="">
    </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch(error => {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>
</body>
</html>
